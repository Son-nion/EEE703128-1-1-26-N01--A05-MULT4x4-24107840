name: OpenLane ASIC Flow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  openlane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenLane Flow
        run: |
          docker run --rm \
            -v $(pwd):/openlane/designs/A05_array_mult4x4 \
            -e PDK_ROOT=/openlane/pdks \
            efabless/openlane:v1.0.0 \
            bash -c "./flow.tcl -design A05_array_mult4x4"

      - name: Upload GDS & Reports Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openlane-results
          path: |
            designs/A05_array_mult4x4/runs/
